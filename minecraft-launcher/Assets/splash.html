<title>minePulseLite</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Exo+2:wght@300;800&display=swap">

<style>
/* ─── Tokens ─────────────────────────────────────────── */
:root {
  --bg:    #060A07;
  --acc:   #50FA7B;
  --stone: #5B7660;
  --muted: #384E3C;
  --dim:   #1B2E1E;
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 100%; height: 100%;
  background: var(--bg);
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ─── Stage ──────────────────────────────────────────── */
.splash {
  position: relative;
  width: min(800px, 100vw);
  aspect-ratio: 16 / 9;
  background: var(--bg);
  overflow: hidden;
}

/* ─── Canvas (pulse line) ────────────────────────────── */
.splash canvas {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  z-index: 1;
}

/* ─── Ambient glow halo ──────────────────────────────── */
.amb {
  position: absolute; inset: 0; z-index: 2; pointer-events: none;
  background: radial-gradient(
    ellipse 54% 58% at 50% 50%,
    rgba(80, 250, 123, 0.06) 0%,
    transparent 68%
  );
  animation: amb-beat 2.3s ease-in-out infinite;
}
@keyframes amb-beat {
  0%, 100% { filter: brightness(0.75); }
  21%       { filter: brightness(2.8);  }
  42%       { filter: brightness(0.75); }
}

/* ─── Logo ───────────────────────────────────────────── */
.logo {
  position: absolute; inset: 0; z-index: 3;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  pointer-events: none;
}

.mine {
  font-family: 'Press Start 2P', monospace;
  font-size: clamp(7px, 1.2vw, 11px);
  color: var(--stone);
  letter-spacing: 0.4em;
  margin-bottom: clamp(3px, 0.7vw, 7px);
  opacity: 0.85;
}

.pulse-name {
  font-family: 'Exo 2', sans-serif;
  font-size: clamp(50px, 9.4vw, 84px);
  font-weight: 800;
  color: var(--acc);
  line-height: 0.88;
  letter-spacing: -0.025em;
  text-shadow:
    0 0 15px rgba(80, 250, 123, 0.7),
    0 0 45px rgba(80, 250, 123, 0.2),
    0 0 88px rgba(80, 250, 123, 0.09);
  animation: logo-beat 2.3s ease-in-out infinite;
}
@keyframes logo-beat {
  0%, 100% {
    text-shadow:
      0 0 15px rgba(80, 250, 123, 0.7),
      0 0 45px rgba(80, 250, 123, 0.2),
      0 0 88px rgba(80, 250, 123, 0.09);
  }
  21% {
    text-shadow:
      0 0 22px rgba(80, 250, 123, 0.95),
      0 0 65px rgba(80, 250, 123, 0.45),
      0 0 120px rgba(80, 250, 123, 0.22);
  }
  42% {
    text-shadow:
      0 0 15px rgba(80, 250, 123, 0.7),
      0 0 45px rgba(80, 250, 123, 0.2),
      0 0 88px rgba(80, 250, 123, 0.09);
  }
}

.lite-name {
  font-family: 'Exo 2', sans-serif;
  font-size: clamp(9px, 1.6vw, 14px);
  font-weight: 300;
  color: var(--muted);
  letter-spacing: 0.62em;
  text-transform: uppercase;
  margin-top: clamp(5px, 0.9vw, 9px);
}

/* ─── Tagline ─────────────────────────────────────────── */
.tagline {
  position: absolute;
  bottom: clamp(10px, 2.3vw, 22px);
  left: 50%; transform: translateX(-50%);
  z-index: 3; pointer-events: none; white-space: nowrap;
  font-family: 'Exo 2', sans-serif;
  font-size: clamp(7px, 1vw, 10px);
  color: var(--dim);
  letter-spacing: 0.24em;
  text-transform: uppercase;
}

/* ─── Version ─────────────────────────────────────────── */
.ver {
  position: absolute;
  top: clamp(10px, 1.9vw, 18px);
  right: clamp(12px, 2.4vw, 22px);
  z-index: 3; pointer-events: none;
  font-family: 'Press Start 2P', monospace;
  font-size: clamp(5px, 0.8vw, 8px);
  color: var(--dim);
}

/* ─── Corner markers ─────────────────────────────────── */
.cn {
  position: absolute; z-index: 3;
  width: 9px; height: 9px;
  border: 1.5px solid var(--dim);
}
.cn-tl { top: 14px; left: 14px;  border-right: 0; border-bottom: 0; }
.cn-tr { top: 14px; right: 14px; border-left: 0;  border-bottom: 0; }
.cn-bl { bottom: 14px; left: 14px;  border-right: 0; border-top: 0; }
.cn-br { bottom: 14px; right: 14px; border-left: 0;  border-top: 0; }

/* ─── Scanlines ───────────────────────────────────────── */
.scan {
  position: absolute; inset: 0; z-index: 5; pointer-events: none;
  background: repeating-linear-gradient(
    to bottom,
    transparent 0, transparent 3px,
    rgba(0, 0, 0, 0.055) 3px, rgba(0, 0, 0, 0.055) 4px
  );
}

/* ─── Reduced motion ──────────────────────────────────── */
@media (prefers-reduced-motion: reduce) {
  .amb, .pulse-name { animation: none; }
}
</style>

<div class="splash">
  <canvas id="c"></canvas>
  <div class="amb"></div>

  <div class="logo">
    <span class="mine">mine</span>
    <span class="pulse-name">Pulse</span>
    <span class="lite-name">Lite</span>
  </div>

  <div class="tagline">Lightweight Minecraft Launcher</div>
  <div class="ver">v1.0</div>
  <div class="cn cn-tl"></div>
  <div class="cn cn-tr"></div>
  <div class="cn cn-bl"></div>
  <div class="cn cn-br"></div>
  <div class="scan"></div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
const splash = canvas.parentElement;

function fit() {
  canvas.width  = splash.offsetWidth;
  canvas.height = splash.offsetHeight;
}
fit();
new ResizeObserver(fit).observe(splash);

/* ─── Heartbeat shape ──────────────────────────────────
   Key   = block offset from horizontal centre
   Value = vertical offset in blocks (negative = upward)   */
const SHAPE = new Map([
  [-22,0],[-21,0],[-20,0],[-19,0],[-18,0],[-17,0],[-16,0],[-15,0],[-14,0],[-13,0],
  [-12,0],[-11,-1],[-10,-2],[-9,-2],[-8,-1],   // P-wave
  [-7,0],[-6,0],[-5,0],
  [-4,1],[-3,1],                                 // Q dip
  [-2,-5],[-1,-13],[0,-16],[1,-10],             // R spike (peak = -16 blocks)
  [2,5],[3,7],[4,4],[5,1],                       // S wave
  [6,0],[7,0],[8,0],
  [9,-1],[10,-3],[11,-4],[12,-4],[13,-3],[14,-2],[15,-1], // T-wave
  [16,0],[17,0],[18,0],[19,0],[20,0],[21,0],[22,0],
]);

/* ─── Animation loop ───────────────────────────────────
   PERIOD 138 frames ≈ 2.3 s @ 60 fps — matches CSS anim */
let f = 0;
const PERIOD   = 138;
const BEAT_DUR = 58;

const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function draw() {
  const W  = canvas.width;
  const H  = canvas.height;
  const B  = Math.max(3, Math.round(W / 148));   // block size in px
  const CY = Math.round(H * 0.5);               // vertical centre

  ctx.clearRect(0, 0, W, H);

  const bt   = f % PERIOD;
  const beat = (!reducedMotion && bt < BEAT_DUR)
    ? Math.sin(bt / BEAT_DUR * Math.PI)
    : 0;

  const nBlocks = Math.ceil(W / B) + 2;
  const centre  = Math.floor(nBlocks / 2);

  /* ── Glow pass (blurred clone) ──────────────────── */
  ctx.save();
  ctx.filter = `blur(${(B * 3).toFixed(1)}px)`;
  for (let i = 0; i < nBlocks; i++) {
    const off = i - centre;
    const yB  = SHAPE.get(off) ?? 0;
    const px  = i * B;
    const py  = Math.round((CY + yB * B) / B) * B;
    const dist = Math.abs(off);

    const baseA = dist <= 22
      ? Math.max(0.1, 0.42 - Math.max(0, dist - 12) * 0.032)
      : 0.022;
    const a = Math.min(0.6, baseA + beat * 0.26);

    ctx.fillStyle = `rgba(80,250,123,${a})`;
    ctx.fillRect(px, py, B, B);
  }
  ctx.restore();

  /* ── Sharp pixel pass ───────────────────────────── */
  for (let i = 0; i < nBlocks; i++) {
    const off = i - centre;
    const yB  = SHAPE.get(off) ?? 0;
    const px  = i * B;
    const py  = Math.round((CY + yB * B) / B) * B;
    const dist = Math.abs(off);

    const baseA = dist <= 22
      ? Math.max(0.15, 0.68 - Math.max(0, dist - 12) * 0.038)
      : 0.035;
    const a = Math.min(0.97, baseA + beat * 0.22);

    ctx.fillStyle = `rgba(80,250,123,${a})`;
    ctx.fillRect(px, py, B - 1, B - 1);   // 1 px gap = pixel grid feel
  }

  f++;
  requestAnimationFrame(draw);
}

draw();
</script>
